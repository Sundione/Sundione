t2p-data-scientist:
  company: T2P Co., Ltd.
  companyUrl: https://www.t2pco.com/th
  location: Bangkok, Thailand
  role:
    en: Data Scientist
    th: Data Scientist
  start: 2023-08
  summary:
    en: Build machine learning and LLM services for a digital-wallet fintech platform, from prototype to production — real-time fraud and risk scoring, anomaly detection and transaction monitoring; LLM services for text generation, receipt extraction and dashboard summaries; ID-document OCR; and customer segmentation and churn models. Also run the Metabase dashboards, reports and Airflow pipelines behind the company's own monitoring for Bank of Thailand requirements, and work fluently with AI coding agents to learn codebases and explain changes to the team.
    th: พัฒนาบริการ machine learning และ LLM ให้แพลตฟอร์มฟินเทคด้าน digital wallet ตั้งแต่ต้นแบบจนขึ้น production ได้แก่ การประเมินความเสี่ยงและตรวจจับการฉ้อโกงแบบ real-time, anomaly detection และการเฝ้าระวังธุรกรรม, บริการ LLM สำหรับสร้างข้อความ ดึงข้อมูลจากใบเสร็จ และสรุป dashboard, OCR เอกสารยืนยันตัวตน รวมถึง model แบ่งกลุ่มลูกค้าและทำนายการเลิกใช้งาน นอกจากนี้ดูแล dashboard และรายงานบน Metabase และ pipeline บน Airflow ที่ใช้ monitoring ฝั่งบริษัทตามข้อกำหนดของ ธปท. และใช้ AI coding agent อย่างคล่องแคล่วเพื่อศึกษา codebase และอธิบายงานให้ทีมเข้าใจ
  cvHighlights:
    - Build machine learning and LLM services for a digital-wallet fintech platform, from prototype to production
    - "**Fraud & risk:** real-time risk scoring, anomaly detection and transaction monitoring"
    - "**LLM & vision:** text generation, receipt extraction, dashboard summaries and ID-document OCR"
    - "**Data:** Metabase dashboards and Airflow pipelines for Bank of Thailand monitoring; segmentation and churn models"
    - Fluent with AI coding agents to learn codebases and explain changes to the team
  skills: [Fraud & Risk Detection, Anomaly Detection, Supervised ML, LLM Applications, Computer Vision & OCR, Stream Processing, MLOps, Customer Segmentation, Dashboards & Reporting, Regulatory Monitoring, AI Coding Agents]
  tools: [Python, SQL, FastAPI, "AWS (Lambda, S3, DynamoDB, Redshift)", Kafka, Docker, Kubernetes, Airflow, MLflow, Metabase, scikit-learn, XGBoost, LightGBM, OpenAI, Gemini, OpenCV]

